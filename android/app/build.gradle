apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def hermesEnabled = (project.ext.react.hasProperty("enableHermes") ? project.ext.react.enableHermes : true)
def jscFlavor = 'org.webkit:android-jsc:+'
def propOrEnv = { key ->
  return (project.findProperty(key) ?: System.getenv(key))
}
def keystorePath  = propOrEnv("MYAPP_UPLOAD_STORE_FILE")
def keystoreFile  = keystorePath ? rootProject.file(keystorePath) : null
def uploadStorePassword = propOrEnv("MYAPP_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias      = propOrEnv("MYAPP_UPLOAD_KEY_ALIAS")
def uploadKeyPassword   = propOrEnv("MYAPP_UPLOAD_KEY_PASSWORD")

react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
 //   debuggableVariants = ["playDebug"]
}

project.ext.react = [
    enableHermes: true,
    minSdkVersion: 24  // 명시적으로 24로 설정
]

android {
    namespace 'com.bruste68.englishplayondevice.play' 
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    // ✅ Whisper에 필요했던 ndkVersion 제거
    // ndkVersion rootProject.ext.ndkVersion

    defaultConfig {
        applicationId 'com.bruste68.englishplayondevice'
        minSdkVersion Math.max(24, rootProject.ext.minSdkVersion ?: 24)
        targetSdkVersion rootProject.ext.targetSdkVersion ?: 34
//        minSdkVersion 24
//        targetSdkVersion 34
        versionCode 11
        versionName "2.0.1"
        buildConfigField("boolean", "REACT_NATIVE_UNSTABLE_USE_RUNTIME_SCHEDULER_ALWAYS", (findProperty("reactNative.unstable_useRuntimeSchedulerAlways") ?: true).toString())
        buildConfigField("boolean", "IS_HERMES_ENABLED", "true")
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", "false")
    }

    buildFeatures {
        buildConfig = true
    }

    flavorDimensions "store"
    productFlavors {
        play {
            dimension "store"
            applicationId "com.bruste68.englishplayondevice.play"
            versionNameSuffix "-play"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
          if (keystoreFile?.exists() && uploadStorePassword && uploadKeyAlias && uploadKeyPassword) {
            storeFile keystoreFile
            storePassword uploadStorePassword
            keyAlias uploadKeyAlias
            keyPassword uploadKeyPassword
              println "🔐 Using keystore: ${keystoreFile}"
          } else {
            println "⚠️  Release keystore가 설정되지 않았습니다. (경로: ${keystorePath}) 로컬에선 debug로 대체합니다."
            initWith signingConfigs.debug
          }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            matchingFallbacks = ["debug", "release"]
            buildConfigField("boolean", "DEBUG", "true")
        }
        release {
            signingConfig signingConfigs.release
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            buildConfigField("boolean", "DEBUG", "false")
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
      coreLibraryDesugaringEnabled true
    }

    applicationVariants.all { variant ->
        println "✅ 생성된 빌드 Variant: ${variant.name}"
        println "👉 packageName: ${variant.applicationId}"
    }
}



dependencies {
    implementation("com.facebook.react:react-android")
    implementation project(':react-native-iap')
    implementation 'com.android.billingclient:billing:6.0.1'
    // implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // ✅ Whisper 관련 의존성 제거
    // implementation project(':react-native-whisper')
    // implementation 'com.arthenica:ffmpeg-kit-min:6.0'

    implementation 'androidx.startup:startup-runtime:1.1.1'
 //   implementation 'com.arthenica:ffmpeg-kit-full:6.0.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

 //   implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json')"].execute(null, rootDir).text.trim(), "../native_modules.gradle")
applyNativeModulesAppBuildGradle(project)

afterEvaluate {
    println "🧪 DEBUG: defaultConfig.minSdkVersion = ${android.defaultConfig.minSdkVersion.apiLevel}"
}
apply plugin: 'com.google.gms.google-services'

